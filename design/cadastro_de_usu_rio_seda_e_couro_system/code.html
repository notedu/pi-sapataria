<!DOCTYPE html><html class="light" lang="pt-BR"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pattern-bg {
            background-image: radial-gradient(circle at 2px 2px, rgba(0, 44, 124, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-background min-h-screen font-body-md text-on-background antialiased flex flex-col">
<!-- Suppressed TopAppBar and Footer as this is a transactional Signup screen -->
<main class="flex-1 flex w-full">
<div class="flex flex-col md:flex-row w-full h-screen">
<!-- Left Side: Branding -->
<div class="hidden md:flex md:w-1/2 bg-surface-container-low pattern-bg flex-col items-center justify-center p-12 relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-surface-container-low to-surface-container opacity-50 z-0"></div>
<div class="relative z-10 max-w-md w-full flex flex-col items-center">
<img alt="Seda e Couro Logo" class="w-64 h-64 object-contain mb-8 filter drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAt6IETFwzPZP_rautknKYrzf4Jg30nIx-uWPbdQvjbgCEADcFBXPkmhYvIt7witaBojySCfeJVUQItTlVe7Leovb3qGj_7zACv1vUIcxNMVrxJEh6c_7jYqQRGp0J_89W9g0gITAOjg8mSNsehINv1kFMtFVLdOocoZ9UyaOIr4A2nYD0W2jPwhq0rfuiNzJwzScqTfipdregtJ6c8hFIubksKydgjO_RKaSkRAwF5-XImgCw9rNVZ1BwSFTvnMuVlddI">
<h1 class="font-headline-xl text-headline-xl text-primary text-center mb-4">Seda e Couro</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center max-w-sm">Artisanal Excellence. Crafting quality footwear with dedication and precision.</p>
</div>
</div>
<!-- Right Side: Form -->
<div class="w-full md:w-1/2 bg-surface flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-12 relative overflow-y-auto">
<div class="max-w-md w-full mx-auto">
<!-- Mobile Logo (visible only on small screens) -->
<div class="md:hidden flex flex-col items-center mb-8">
<img alt="Seda e Couro Logo" class="w-24 h-24 object-contain mb-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAl8pjtvMBxOh5ixbrHBK87kn6jHP3ADo6EljXxEb6poom4zdE0MZxuxE2lZk_fJ7kS8oubGj00j647vAG7ok2aqiRlQ7zGc9MRJE5gmI0XfKKfgMnbEzHEWzA_K8gROxhhNuGMuvO-z_HDiuveHL9NnPyqvy8d1kAOvAdt94zUIqPUgFzT5JkyGqRD_0ZAAakgq2HBJex4EMDzagmLOIgQgr1jOfIUt-jhZU8OhHbrkpOtJlJ4e6OHDiALerHkRZuO6gI">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Seda e Couro</h1>
</div>
<div class="mb-10 text-center md:text-left">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Criar Conta</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Junte-se a nós para uma experiência artesanal exclusiva.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="fullName">Nome Completo</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-primary/20 rounded-DEFAULT bg-secondary-container/20 text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md text-body-md placeholder-outline-variant" id="fullName" name="fullName" placeholder="João Silva" required="" type="text">
</div>
</div>
<!-- Username -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="username">Usuário</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">alternate_email</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-primary/20 rounded-DEFAULT bg-secondary-container/20 text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md text-body-md placeholder-outline-variant" id="username" name="username" placeholder="joaosilva123" required="" type="text">
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">E-mail</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-primary/20 rounded-DEFAULT bg-secondary-container/20 text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md text-body-md placeholder-outline-variant" id="email" name="email" placeholder="joao@exemplo.com" required="" type="email">
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Senha</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-primary/20 rounded-DEFAULT bg-secondary-container/20 text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md text-body-md placeholder-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="confirmPassword">Confirmar Senha</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock_reset</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-primary/20 rounded-DEFAULT bg-secondary-container/20 text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md text-body-md placeholder-outline-variant" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Register Button -->
<div class="pt-2">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-DEFAULT shadow-sm bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
                                Cadastrar
                            </button>
</div>
</form>
<!-- Login Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                            Já possui uma conta? 
                            <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors underline decoration-primary/30 underline-offset-2" href="#">Entre aqui</a>
</p>
</div>
</div>
</div>
</div>
</main>
</body></html>
